# goreleaser configuration for pickle. Validate with `just dist-check`
# (`goreleaser check`); build a local, unpublished snapshot with `just dist-snapshot`.
# Real releases are cut by pushing a `vX.Y.Z` tag (see RELEASING.md).
version: 2

project_name: pickle

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: pickle
    main: .
    binary: pickle
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: pickle
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# Pin the release forge to GitHub explicitly. goreleaser otherwise infers it and
# will prefer GitLab whenever a GITLAB_TOKEN is present in the environment, which
# would wrongly point release/cask URLs at gitlab.com even though origin is
# github.com. Pinning it here makes the output deterministic.
release:
  github:
    owner: codcod
    name: pickle
  draft: false
  prerelease: auto
  # PDF/EPUB user manual, built by the release workflow into dist/docs/ before
  # this pipe runs (see .github/workflows/release.yml). The docs build is
  # allowed to fail without blocking the release, so these globs may match
  # nothing — goreleaser skips missing extra_files rather than erroring.
  extra_files:
    - glob: dist/docs/pickle-user-manual.pdf
    - glob: dist/docs/pickle-user-manual.epub

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Deliberately using the deprecated `brews` (formula) pipe instead of
# `homebrew_casks`: formulas install into the brew prefix without Gatekeeper
# quarantine, so no xattr post-install hook is needed for the unsigned binary.
brews:
  - name: pickle
    repository:
      owner: codcod
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/codcod/pickle"
    description: "Ticket-based, board-driven feature flow as a CLI"
