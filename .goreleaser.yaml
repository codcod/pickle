# goreleaser configuration for pickle. Validate with `just dist-check`
# (`goreleaser check`); build a local, unpublished snapshot with `just dist-snapshot`.
# Real releases are cut by pushing a `vX.Y.Z` tag (see RELEASING.md).
version: 2

project_name: pickle

before:
  hooks:
    - go mod tidy
    - go test ./...
    # Shell completion scripts for the .deb (nfpms contents below). Hooks run
    # without a shell, so the redirects need sh -c. completions/ is gitignored.
    - sh -c 'mkdir -p completions && go run . completion bash > completions/pickle.bash'
    - sh -c 'go run . completion zsh > completions/_pickle'
    - sh -c 'go run . completion fish > completions/pickle.fish'

builds:
  - id: pickle
    main: .
    binary: pickle
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: pickle
    formats:
      - tar.gz
    # Windows users expect a zip; the brews pipe below only consumes the
    # darwin/linux tarballs, so it is unaffected.
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# Debian/Ubuntu packages, built for the linux targets only and attached to the
# release as extra assets. The brews pipe ignores them (it consumes archives
# only), so the formula is unaffected. The release workflow pushes them to the
# Cloudsmith apt repository afterwards (see RELEASING.md).
nfpms:
  - id: pickle-deb
    package_name: pickle
    ids: [pickle]
    formats: [deb]
    vendor: codcod
    homepage: https://github.com/codcod/pickle
    maintainer: codcod <nikos@linux.com>
    description: Ticket-based, board-driven feature flow as a CLI
    license: MIT
    bindir: /usr/bin
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    contents:
      - src: completions/pickle.bash
        dst: /usr/share/bash-completion/completions/pickle
      - src: completions/_pickle
        dst: /usr/share/zsh/vendor-completions/_pickle
      - src: completions/pickle.fish
        dst: /usr/share/fish/vendor_completions.d/pickle.fish

# Pin the release forge to GitHub explicitly. goreleaser otherwise infers it and
# will prefer GitLab whenever a GITLAB_TOKEN is present in the environment, which
# would wrongly point release/cask URLs at gitlab.com even though origin is
# github.com. Pinning it here makes the output deterministic.
release:
  github:
    owner: codcod
    name: pickle
  draft: false
  prerelease: auto
  # Overwrite existing artifacts on re-run instead of erroring with
  # "already_exists" (422). Lets a re-pushed tag re-publish a release cleanly.
  mode: replace
  # The PDF/EPUB user manual is NOT attached here. goreleaser's extra_files
  # hard-errors when a glob matches nothing ("globbing failed for pattern ...:
  # file does not exist"), which would let a soft-failed docs build sink the
  # whole release. The manual is uploaded after this pipe by a guarded
  # `gh release upload` step in .github/workflows/release.yml instead, so a
  # missing manual never blocks publishing the binaries.

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Deliberately using the deprecated `brews` (formula) pipe instead of
# `homebrew_casks`: formulas install into the brew prefix without Gatekeeper
# quarantine, so no xattr post-install hook is needed for the unsigned binary.
brews:
  - name: pickle
    repository:
      owner: codcod
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/codcod/pickle"
    description: "Ticket-based, board-driven feature flow as a CLI"
    # Homebrew runs `pickle completion bash|zsh|fish` itself and installs each.
    install: |
      bin.install "pickle"
      generate_completions_from_executable(bin/"pickle", "completion")
