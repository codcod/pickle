# goreleaser configuration for pickle. Validate with `just dist-check`
# (`goreleaser check`); build a local, unpublished snapshot with `just dist-snapshot`.
# Real releases are cut by pushing a `vX.Y.Z` tag (see RELEASING.md).
version: 2

project_name: pickle

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: pickle
    main: .
    binary: pickle
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: pickle
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# Pin the release forge to GitHub explicitly. goreleaser otherwise infers it and
# will prefer GitLab whenever a GITLAB_TOKEN is present in the environment, which
# would wrongly point release/cask URLs at gitlab.com even though origin is
# github.com. Pinning it here makes the output deterministic.
release:
  github:
    owner: codcod
    name: pickle
  draft: false
  prerelease: auto

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew cask (goreleaser deprecated `brews`/formulae in favour of casks for
# pre-built binaries). Published to the separate tap repo; users then run
# `brew install codcod/taps/pickle`. Casks are macOS-only — Linux users install
# via `go install` or the release archives.
homebrew_casks:
  - name: pickle
    binaries: [pickle]
    repository:
      owner: codcod
      name: homebrew-taps
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/codcod/pickle"
    description: "Ticket-based, board-driven feature flow as a CLI"
    # Strip macOS quarantine so the unsigned binary runs without a Gatekeeper prompt.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/pickle"]
          end
