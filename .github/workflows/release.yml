name: release

# Cut a release by pushing a semver tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# See RELEASING.md for the one-time repo/secret setup this depends on.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.3). Must already exist.'
        required: true

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # goreleaser needs full history + tags for the version
          ref: ${{ inputs.tag || github.ref }}   # dispatch: the requested tag; push: the pushed tag
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Build the PDF/EPUB user manual into dist/docs/ so the goreleaser
      # `release.extra_files` pipe can attach it. Soft-fail: a broken manual
      # must not block publishing the binaries — goreleaser then just finds no
      # files to attach. Uses the runner's preinstalled Linuxbrew + Ruby.
      - name: Build user manual (PDF + EPUB)
        continue-on-error: true
        run: |
          brew install codcod/taps/snowball
          snowball setup
          snowball build -o dist/docs
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          # Publishes the GitHub release in this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with `repo` scope on the tap repo, so goreleaser can push the
          # updated cask to github.com/codcod/homebrew-taps (see RELEASING.md).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
