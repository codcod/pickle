name: release

# Cut a release by pushing a semver tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# See RELEASING.md for the one-time repo/secret setup this depends on.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.3). Must already exist.'
        required: true

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # goreleaser needs full history + tags for the version
          ref: ${{ inputs.tag || github.ref }}   # dispatch: the requested tag; push: the pushed tag
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Build the PDF/EPUB user manual into $RUNNER_TEMP (outside the repo)
      # so the post-release upload step can attach it. It must live outside
      # the working tree for two reasons: goreleaser runs `release --clean`
      # (wiping dist/), and it also refuses to run against a dirty tree — an
      # untracked manual/ dir in the repo root would trip its dirty check.
      # Soft-fail: a broken manual must not block publishing the binaries.
      # The toolchain steps (Homebrew shellenv, snowball install, the bundler
      # shim, diagnostics) live in .github/scripts/build-manual.sh (T-087) —
      # shared with manual-smoke.yml, which is how this step gets exercised
      # without cutting a release. The HOMEBREW_* settings this step used to
      # carry (tap trust, quiet output) are defaults inside that script now,
      # so they live in one place with their rationale. See it for the
      # step-by-step reasoning.
      - name: Build user manual (PDF + EPUB)
        continue-on-error: true
        run: .github/scripts/build-manual.sh . "$RUNNER_TEMP/manual"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          # Publishes the GitHub release in this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with `repo` scope on the tap repo, so goreleaser can push the
          # updated cask to github.com/codcod/homebrew-taps (see RELEASING.md).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      # Attach the user manual after goreleaser has published the release.
      # Kept out of goreleaser's extra_files because that pipe hard-errors on a
      # missing file; here a soft-failed docs build just means nothing to upload
      # and the release still stands. Only uploads manuals that actually exist.
      - name: Attach user manual to release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          shopt -s nullglob
          # Version without the leading 'v' (v0.2.1 -> 0.2.1), matching the
          # binary archive names, so assets read pickle-user-manual-0.2.1.pdf.
          version="${TAG#v}"
          existing=()
          for ext in pdf epub; do
            src="$RUNNER_TEMP/manual/pickle-user-manual.$ext"
            [ -f "$src" ] || continue
            dst="$RUNNER_TEMP/manual/pickle-user-manual-$version.$ext"
            mv "$src" "$dst"
            existing+=("$dst")
          done
          if [ ${#existing[@]} -eq 0 ]; then
            # A soft-failed build previously exited 0 here with nothing more than this log
            # line, which is how v0.2.2 and v0.3.0 both shipped with no manual attached and
            # nobody noticed for ten days (T-087). Annotate loudly instead, still exit 0 —
            # the soft-fail contract itself (RELEASING.md) is unchanged.
            echo "::warning::Release $TAG has no user manual attached — the build step failed;" \
              "see its log for the actual cause."
            {
              echo "### ⚠️ No user manual attached to $TAG"
              echo "The 'Build user manual (PDF + EPUB)' step failed (soft-fail: this does not"
              echo "block the release). See that step's log for the cause."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release upload "$TAG" "${existing[@]}" --clobber
