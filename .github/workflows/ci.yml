name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: test
        run: go test ./...
      - name: build
        run: go build -o pickle .
      # Windows is a release target (T-143); vet type-checks the test files too.
      - name: windows cross-compile
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go build -o /dev/null .
      - name: board audit
        run: ./pickle board audit

  # Runs the real pickle.exe on Windows (T-143). GitHub's runners can create symlinks, so
  # this proves the binary, the lock and the hooks there — not the copy fallback, which the
  # unit tests cover by injecting a symlink failure.
  windows-smoke:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: smoke
        run: |
          # RUNNER_TEMP is a Windows path (D:\a\_temp); its drive colon would split PATH.
          t=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p "$t/bin"
          go build -o "$t/bin/pickle.exe" .
          .github/scripts/smoke.sh "$t/bin" "$t/smoke"

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true
      # Exit 2 = "valid, but deprecated properties": the `brews` (formula) pipe
      # is deliberate (see the comment in .goreleaser.yaml), so tolerate it —
      # mirrors `just dist-check`. Exit 1 (invalid config) still fails.
      - name: goreleaser check
        run: goreleaser check || [ $? -eq 2 ]

  ci-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Pinned, never @latest: a floating lint version turns unrelated PRs red.
      # v1.7.12 was the current release at implementation time (T-088).
      - name: install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # Asserted, not assumed: shellcheck ships in the ubuntu-latest image, and if
      # that ever stops being true this must fail loudly rather than silently skip
      # the lint (which is the failure mode T-088 exists to remove).
      - name: shellcheck present
        run: shellcheck --version
      # actionlint shells out to shellcheck for every `run:` body when it is on
      # PATH — that is what catches the ${{ }}-into-run: injection class (T-087).
      - name: actionlint
        run: actionlint
      - name: shellcheck
        run: shellcheck .github/scripts/*.sh
