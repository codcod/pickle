name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: test
        run: go test ./...
      - name: build
        run: go build -o pickle .
      - name: board audit
        run: ./pickle board audit

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true
      # Exit 2 = "valid, but deprecated properties": the `brews` (formula) pipe
      # is deliberate (see the comment in .goreleaser.yaml), so tolerate it —
      # mirrors `just dist-check`. Exit 1 (invalid config) still fails.
      - name: goreleaser check
        run: goreleaser check || [ $? -eq 2 ]
